name: Agent content recovery

on:
  push:
    branches:
      - agent/rules-content-recovery

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply content recovery
        run: node scripts/agent-content-recovery.mjs
      - name: Regenerate canonical reading surfaces
        run: npm run build
      - name: Validate rules
        run: npm run check
      - name: Commit recovered rules and generated surfaces
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover rule content and regenerate surfaces [skip ci]"
          git push
