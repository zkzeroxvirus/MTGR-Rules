name: Regenerate finish-audit outputs

on:
  push:
    branches: [agent/finish-semantic-rules-audit]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-semantic-rules-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: Commit generated outputs
        run: |
          if git diff --quiet -- RULEBOOK.md generated/PLAYER-REFERENCE.md generated/HOST-REFERENCE.md rules/README.md; then
            echo "Generated outputs already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RULEBOOK.md generated/PLAYER-REFERENCE.md generated/HOST-REFERENCE.md rules/README.md
          git commit -m "Regenerate rulebook outputs"
          git push origin HEAD:agent/finish-semantic-rules-audit
