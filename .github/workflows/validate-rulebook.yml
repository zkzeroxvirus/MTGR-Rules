name: Validate rule contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rule-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
