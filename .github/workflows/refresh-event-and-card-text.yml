name: Refresh Event and card text

on:
  push:
    branches:
      - agent/event-system-refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/event-system-refresh
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refresh-event-and-card-text.py
      - name: Commit refreshed rules
        run: |
          git rm .github/workflows/refresh-event-and-card-text.yml scripts/refresh-event-and-card-text.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refresh Event rules and card text"
          git push origin HEAD:agent/event-system-refresh
