name: Materialize semantic rule sources

on:
  push:
    branches: [agent/rule-contracts-v2]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rule-contracts-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run materialize
      - name: Commit semantic rule tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules generated RULEBOOK.md rulebook-manifest.json PLATFORM-SURFACE-CONTRACTS.json PROGRESSION-CONTRACTS.json
          if git diff --cached --quiet; then
            echo "No materialization changes to commit."
            exit 0
          fi
          git commit -m "Materialize canonical semantic rule sources"
          git push origin HEAD:agent/rule-contracts-v2
