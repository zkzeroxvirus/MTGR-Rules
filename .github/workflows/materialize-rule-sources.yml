name: Finalize semantic rule migration

on:
  push:
    branches: [agent/rule-contracts-v2]
    paths:
      - scripts/finalize-rule-migration.mjs

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rule-contracts-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/finalize-rule-migration.mjs
      - run: npm run check
      - name: Commit final repository layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes to commit."
            exit 0
          fi
          git commit -m "Finalize semantic Rules repository layout"
          git push origin HEAD:agent/rule-contracts-v2
